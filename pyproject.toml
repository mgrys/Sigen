[project]
name = "sigen-pv-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography",
    "fastapi>=0.110",
    "pymodbus>=3.6,<4",
