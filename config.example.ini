; Sigen PV Monitor - przykladowa konfiguracja.
; Program sam tworzy config.ini przy pierwszym starcie; wszystko mozna tez ustawic na stronie (zakladka Ustawienia).
; Wartosci w polacie: nazwa | moc kWp | azymut (0 = poludnie, -90 = wschod, 90 = zachod) | nachylenie w stopniach

[moduly]
; co masz: instalacja PV Sigen i/lub rekuperator Vallox (tak / nie / auto)
; pv = nie -> bez odczytu falownika i bez komunikatow o nim (tylko zakladka Rekuperacja)
pv = auto
vallox = auto

[falownik]
host = 192.168.1.100
port = 502
plant_id = 247
inverter_id = 1
interval = 5

[serwer]
port = 8000
host = 0.0.0.0
otworz_przegladarke = tak

[baza]
plik = sigen.db

[instalacja]
lat = 52.23
lon = 21.01
moc_falownika_kw = 10
pr = 0.85
strefa_czasowa = Europe/Warsaw

[polacie]
polac1 = Poludnie | 5.0 | 0 | 30
polac2 = Wschod | 2.5 | -90 | 30
polac3 = Zachod | 2.5 | 90 | 30

[stringi]
pv1 = Poludnie
pv2 = Wschod-Zachod
pv3 =
pv4 =

[prognoza]
glowne_zrodlo = open_meteo
forecast_solar = tak
korekta =

[rekuperacja]
; opcjonalnie: rekuperator Vallox seria MV (MyVallox); puste vallox_ip = bez zakladki Rekuperacja
vallox_ip =
; model: auto (odczyt z rekuperatora), 096, 110, 145, 245 albo inny (wtedy przeplyw_max_m3h z karty katalogowej)
model = auto
przeplyw_max_m3h =
obroty_max =
; miernik poboru pradu rekuperatora: shelly, smartlife albo puste
; smartlife nie uzywa miernik_ip (konto i gniazdko sa w bazie, zakladka Ustawienia)
miernik =
miernik_ip =
nagrzewnica_w = 150

[porownanie]
; ceny energii sprzedawcy z cena taryfowa wg stref wybranej taryfy [zl/kWh brutto, z akcyza] - porownanie z Pstrykiem
; klucze stref jak w taryfie (np. G13: morning_peak, afternoon_peak, off_peak); puste = TAURON 2026 (G11 / G13) albo brak
; off_peak = 0.524

[ceny]
operator = tauron
taryfa = G11
vat = 0.23
marza_zl_kwh = 0.0732
akcyza_zl_kwh = 0.005
zakup_baza = rce
sprzedaz_baza = rce

[strategia]
; strategia osobista - plan pracy magazynu; sterowanie falownikiem wlacza sie na stronie (domyslnie WYLACZONE)
pojemnosc_kwh =
moc_ladowania_kw = 5
sprzedaz_z_magazynu_od =
ladowanie_z_sieci_do =
; oszczedzanie baterii: maks. moc ladowania z sieci / sprzedazy z magazynu [kW]; puste = moc_ladowania_kw
moc_ladowania_z_sieci_maks_kw =
moc_sprzedazy_maks_kw =
; standby (dom z sieci, magazyn stoi) przy przewidywanym poborze domu ponizej [W]; puste = wg kosztow i strat falownika
standby_ponizej_w =
; Tarcza Pstryk (tylko z Pstrykiem): limit sredniej ceny energii w miesiacu [zl/kWh z VAT]; tryb: auto | tak | nie.
; Gdy dziala - zakup po stalej cenie, plan nie rozladowuje magazynu do domu, laduje z PV (PV do magazynu) pod sprzedaz.
tarcza_limit_zl_kwh = 0.61
tarcza_tryb = auto
; rezerwa pod sprzedaz przy Tarczy [% pojemnosci] - energia trzymana na drogie godziny (puste / 0 = bez rezerwy)
tarcza_rezerwa_proc = 60
; sprzedaz tylko energii z PV (arbitraz zgodny z prawem): do sieci najwyzej tyle, ile instalacja wyprodukowala
; w ostatnich N dniach minus to, co juz oddano (z licznikow falownika); puste = 7
sprzedaz_tylko_z_pv_dni = 7
; tak = arbitraz niezgodny z prawem (sprzedaz z magazynu bez limitu z PV), nie = limit zawsze dziala
arbitraz_niezgodny_z_prawem = nie

[ha]
; karty Home Assistant (docs/HOME_ASSISTANT.md): dodatkowe adresy HA (poza stronami na porcie 8123), po przecinku
origins =
